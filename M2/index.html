<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CTB Milestone 2 – SIT Execution Tracker</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #F4F5F4; }
body {
  font-family: 'Segoe UI', 'DM Sans', system-ui, -apple-system, sans-serif;
  color: #162325;
}
select, input, button { font-family: inherit; font-size: 13px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #F4F5F4; }
::-webkit-scrollbar-thumb { background: #C7CFCE; border-radius: 4px; }

.app { max-width: 1180px; margin: 0 auto; padding: 0 20px 48px; }

.app-header { padding-top: 28px; }
.header-inner { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #00505A; margin-bottom: 6px; }
.app-header h1 { font-size: 26px; font-weight: 700; color: #003036; line-height: 1.2; margin-bottom: 6px; }
.header-meta { font-size: 12.5px; color: #57676A; }
.header-actions { display: flex; gap: 10px; }
.upload-btn {
  background: #003036; color: #FFF699; border: none; border-radius: 6px;
  padding: 9px 16px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.upload-btn:hover { background: #00505A; }
.gold-rule { height: 3px; background: linear-gradient(90deg, #FFF699 0%, #FEF2C2 60%, transparent 100%); margin: 18px 0 22px; border-radius: 2px; }

.tab-bar { display: flex; gap: 4px; border-bottom: 1px solid #DDE3E2; margin-bottom: 22px; }
.tab-btn {
  background: none; border: none; padding: 10px 16px; font-size: 13.5px; font-weight: 600;
  color: #57676A; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab-btn:hover { color: #003036; }
.tab-btn.active { color: #003036; border-bottom-color: #18B89F; }

.card-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; margin-bottom: 24px; }
@media (max-width: 1050px) { .card-grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 640px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }

.stat-card { background: #FFFFFF; border-radius: 10px; padding: 16px 14px 14px; position: relative; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.stat-bar { position: absolute; top: 0; left: 0; right: 0; height: 4px; }
.stat-value { font-size: 24px; font-weight: 700; color: #003036; margin-top: 6px; }
.stat-label { font-size: 12px; font-weight: 600; color: #3A4749; margin-top: 4px; }
.stat-note { font-size: 11px; color: #8B979A; margin-top: 2px; }

.panel { background: #FFFFFF; border-radius: 10px; padding: 18px 18px 8px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 6px; }
.panel-head h2 { font-size: 15.5px; color: #003036; font-weight: 700; }
.panel-sub { font-size: 12px; color: #8B979A; }
.empty-state { padding: 32px; text-align: center; color: #8B979A; font-size: 13.5px; }

.table-wrap { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; font-size: 11px; font-weight: 700; color: #57676A; text-transform: uppercase; letter-spacing: 0.03em; padding: 8px 10px; border-bottom: 2px solid #EDEFEE; white-space: nowrap; }
.data-table td { padding: 9px 10px; border-bottom: 1px solid #F0F2F1; vertical-align: top; }
.data-table tbody tr:hover { background: #FAFBFA; }
.data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.data-table .muted { color: #B7BFC0; }

.req-cell { min-width: 220px; }
.req-id { font-weight: 700; color: #003036; font-size: 13px; }
.req-desc { font-size: 11.5px; color: #8B979A; margin-top: 2px; max-width: 320px; }
.flag { font-size: 10.5px; color: #974f0c; font-weight: 700; margin-left: 6px; }

.num.pass { color: #1E9E51; font-weight: 700; }
.num.fail { color: #C4362A; font-weight: 700; }
.num.prog { color: #2E86C1; font-weight: 700; }
.num.untested { color: #8C949A; }
.num.blocked { color: #D98A1E; font-weight: 700; }

.bar-cell { min-width: 140px; }
.stack-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #EDEFEE; }
.stack-bar span { display: block; height: 100%; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; }

.card-grid.tester-grid { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 900px) { .card-grid.tester-grid { grid-template-columns: 1fr; } }
.tester-card { background: #FFFFFF; border-radius: 10px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.tester-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.tester-avatar { width: 36px; height: 36px; border-radius: 50%; background: #003036; color: #FFF699; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.tester-name { font-weight: 700; color: #003036; font-size: 14px; }
.tester-sub { font-size: 11.5px; color: #8B979A; }
.tester-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tester-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #EDEFEE; }
.tester-bar span { display: block; height: 100%; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filters input[type="text"] { flex: 1 1 200px; padding: 8px 10px; border: 1px solid #DDE3E2; border-radius: 6px; }
.filters select { padding: 8px 10px; border: 1px solid #DDE3E2; border-radius: 6px; background: #fff; }

.mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; color: #57676A; }
.tester-cell { font-weight: 600; color: #003036; white-space: nowrap; }
.day-cell { text-align: center; min-width: 64px; }
.day-total { font-weight: 700; color: #003036; font-size: 13px; }
.day-breakdown { display: flex; gap: 4px; justify-content: center; margin-top: 2px; }
.mini { font-size: 10px; font-weight: 700; padding: 1px 4px; border-radius: 4px; }
.mini.pass { background: #B8F1CC; color: #0B4A25; }
.mini.fail { background: #FDA39C; color: #7A1B12; }
.mini.prog { background: #A5E4FF; color: #0B3B57; }

.app-footer { text-align: center; font-size: 11px; color: #8B979A; padding: 24px 0 8px; letter-spacing: 0.04em; }

</style>
</head>

<script>
// CTB Milestone 2 — SIT Execution Tracker
// Monument Technology branded standalone tracker

const BRAND = {
  teal900: '#003036',
  teal700: '#00505A',
  teal400: '#18B89F',
  gold: '#FFF699',
  goldPale: '#FEF2C2',
  salmon: '#FDA39C',
  mint: '#B8F1CC',
  sky: '#A5E4FF',
  amber: '#FFCB7D',
  grey: '#E8E8E8',
  ink: '#0C1A1C'
};

const STATUS_COLORS = {
  'Passed': { bg: BRAND.mint, fg: '#0B4A25', dot: '#1E9E51' },
  'Failed': { bg: BRAND.salmon, fg: '#7A1B12', dot: '#C4362A' },
  'In Progress': { bg: BRAND.sky, fg: '#0B3B57', dot: '#2E86C1' },
  'Blocked': { bg: BRAND.amber, fg: '#7A4A0B', dot: '#D98A1E' },
  'Untested': { bg: BRAND.grey, fg: '#3A3F42', dot: '#8C949A' },
  'N/A': { bg: '#F1EFE9', fg: '#6B6456', dot: '#B8AE99' }
};

const STATUS_ORDER = ['Passed', 'Failed', 'In Progress', 'Blocked', 'Untested', 'N/A'];

let RAW = []; // current dataset (array of record objects)
let META = { title: 'CTB Milestone 2 — SIT Execution Tracker', generated: '' };
let activeTab = 'overview';
let detailFilters = { status: 'All', req: 'All', tester: 'All', q: '' };

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function dayKey(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return d.toISOString().slice(0, 10);
}
function pct(n, d) { return d === 0 ? 0 : Math.round((n / d) * 1000) / 10; }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function computeSummary(rows) {
  const byStatus = {};
  STATUS_ORDER.forEach(s => byStatus[s] = 0);
  rows.forEach(r => {
    const s = r['Test Run Latest Status'] || 'N/A';
    byStatus[s] = (byStatus[s] || 0) + 1;
  });
  const total = rows.length;
  const executed = byStatus['Passed'] + byStatus['Failed'] + byStatus['In Progress'];
  const passRate = pct(byStatus['Passed'], executed || 1);
  return { total, byStatus, executed, passRate };
}

function computeByRequirement(rows) {
  const map = new Map();
  rows.forEach(r => {
    const key = r['Req ID'] || 'Unassigned';
    if (!map.has(key)) {
      map.set(key, { req: key, desc: r['Run Desc'] || '', total: 0, Passed: 0, Failed: 0, 'In Progress': 0, Blocked: 0, Untested: 0, 'N/A': 0 });
    }
    const e = map.get(key);
    e.total += 1;
    const s = r['Test Run Latest Status'] || 'N/A';
    e[s] = (e[s] || 0) + 1;
  });
  return Array.from(map.values()).sort((a, b) => b.total - a.total);
}

function computeByTester(rows) {
  const executed = rows.filter(r => ['Passed', 'Failed', 'In Progress'].includes(r['Test Run Latest Status']));
  const map = new Map();
  executed.forEach(r => {
    const key = r['Test Case Assignee'] || 'Unassigned';
    if (!map.has(key)) {
      map.set(key, { tester: key, total: 0, Passed: 0, Failed: 0, 'In Progress': 0, days: new Set() });
    }
    const e = map.get(key);
    e.total += 1;
    const s = r['Test Run Latest Status'];
    e[s] = (e[s] || 0) + 1;
    const dk = dayKey(r['Test Result Last Updated At']);
    if (dk) e.days.add(dk);
  });
  return Array.from(map.values()).map(e => ({ ...e, activeDays: e.days.size })).sort((a, b) => b.total - a.total);
}

function computeDaily(rows) {
  const executed = rows.filter(r => ['Passed', 'Failed', 'In Progress'].includes(r['Test Run Latest Status']) && dayKey(r['Test Result Last Updated At']));
  const testers = Array.from(new Set(executed.map(r => r['Test Case Assignee'] || 'Unassigned'))).sort();
  const days = Array.from(new Set(executed.map(r => dayKey(r['Test Result Last Updated At'])))).sort();
  const grid = {};
  testers.forEach(t => { grid[t] = {}; days.forEach(d => grid[t][d] = { Passed: 0, Failed: 0, 'In Progress': 0 }); });
  executed.forEach(r => {
    const t = r['Test Case Assignee'] || 'Unassigned';
    const d = dayKey(r['Test Result Last Updated At']);
    const s = r['Test Run Latest Status'];
    grid[t][d][s] += 1;
  });
  return { testers, days, grid };
}

function statusPill(status, count) {
  const c = STATUS_COLORS[status] || STATUS_COLORS['N/A'];
  return `<span class="pill" style="background:${c.bg};color:${c.fg}"><span class="dot" style="background:${c.dot}"></span>${escapeHtml(status)}${count != null ? ' · ' + count : ''}</span>`;
}

function renderSummaryCards(summary) {
  const cards = [
    { label: 'Total test cases', value: summary.total, note: 'in this export', accent: BRAND.teal700 },
    { label: 'Passed', value: summary.byStatus['Passed'], note: `${pct(summary.byStatus['Passed'], summary.total)}% of total`, accent: STATUS_COLORS['Passed'].dot },
    { label: 'Failed', value: summary.byStatus['Failed'], note: `${pct(summary.byStatus['Failed'], summary.total)}% of total`, accent: STATUS_COLORS['Failed'].dot },
    { label: 'In progress', value: summary.byStatus['In Progress'], note: `${pct(summary.byStatus['In Progress'], summary.total)}% of total`, accent: STATUS_COLORS['In Progress'].dot },
    { label: 'Blocked', value: summary.byStatus['Blocked'] || 0, note: `${pct(summary.byStatus['Blocked'] || 0, summary.total)}% of total`, accent: STATUS_COLORS['Blocked'].dot },
    { label: 'Untested', value: summary.byStatus['Untested'], note: `${pct(summary.byStatus['Untested'], summary.total)}% of total`, accent: STATUS_COLORS['Untested'].dot },
    { label: 'Pass rate (executed)', value: summary.passRate + '%', note: `${summary.executed} executed so far`, accent: BRAND.gold, dark: true }
  ];
  return `<div class="card-grid">${cards.map(c => `
    <div class="stat-card">
      <div class="stat-bar" style="background:${c.accent}"></div>
      <div class="stat-value">${c.value}</div>
      <div class="stat-label">${escapeHtml(c.label)}</div>
      <div class="stat-note">${escapeHtml(c.note)}</div>
    </div>`).join('')}</div>`;
}

function renderReqTable(reqRows) {
  const rows = reqRows.map(r => {
    const executed = r.Passed + r.Failed + r['In Progress'];
    const barSegs = STATUS_ORDER.map(s => {
      const w = pct(r[s] || 0, r.total || 1);
      return w > 0 ? `<span style="width:${w}%;background:${STATUS_COLORS[s].dot}" title="${s}: ${r[s]}"></span>` : '';
    }).join('');
    const flag = r.req === 'GLIA' ? ' <span class="flag" title="Glia Secure Messaging is confirmed M3 scope — flag for removal from M2 run">⚑ M3 scope?</span>' : '';
    return `<tr>
      <td class="req-cell"><span class="req-id">${escapeHtml(r.req)}</span>${flag}<div class="req-desc">${escapeHtml(r.desc)}</div></td>
      <td class="num">${r.total}</td>
      <td class="num pass">${r.Passed}</td>
      <td class="num fail">${r.Failed}</td>
      <td class="num prog">${r['In Progress']}</td>
      <td class="num blocked">${r.Blocked || 0}</td>
      <td class="num untested">${r.Untested}</td>
      <td class="num">${r['N/A']}</td>
      <td class="bar-cell"><div class="stack-bar">${barSegs || '<span style="width:100%;background:#E8E8E8"></span>'}</div></td>
    </tr>`;
  }).join('');
  return `
  <div class="panel">
    <div class="panel-head">
      <h2>Coverage by requirement / test run</h2>
      <span class="panel-sub">${reqRows.length} requirement groupings</span>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr>
          <th>Requirement / Test run</th><th class="num">Total</th><th class="num">Passed</th><th class="num">Failed</th>
          <th class="num">In Prog.</th><th class="num">Blocked</th><th class="num">Untested</th><th class="num">N/A</th><th>Progress</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

function renderOverview() {
  const summary = computeSummary(RAW);
  const reqRows = computeByRequirement(RAW);
  return `
    ${renderSummaryCards(summary)}
    ${renderReqTable(reqRows)}
  `;
}

function renderByTester() {
  const testers = computeByTester(RAW);
  if (testers.length === 0) {
    return `<div class="panel empty-state"><p>No executed test results yet — nothing to show tester-by-tester until runs are logged.</p></div>`;
  }
  return `<div class="card-grid tester-grid">${testers.map(t => `
    <div class="tester-card">
      <div class="tester-head">
        <div class="tester-avatar">${escapeHtml((t.tester || '?').slice(0,1).toUpperCase())}</div>
        <div>
          <div class="tester-name">${escapeHtml(t.tester)}</div>
          <div class="tester-sub">${t.activeDays} active day${t.activeDays === 1 ? '' : 's'} · ${t.total} executed</div>
        </div>
      </div>
      <div class="tester-pills">
        ${statusPill('Passed', t.Passed)}
        ${statusPill('Failed', t.Failed)}
        ${statusPill('In Progress', t['In Progress'])}
      </div>
      <div class="tester-bar">
        ${STATUS_ORDER.filter(s => s !== 'Untested' && s !== 'N/A').map(s => {
          const w = pct(t[s] || 0, t.total || 1);
          return w > 0 ? `<span style="width:${w}%;background:${STATUS_COLORS[s].dot}"></span>` : '';
        }).join('')}
      </div>
    </div>`).join('')}</div>`;
}

function renderDaily() {
  const { testers, days, grid } = computeDaily(RAW);
  if (days.length === 0) {
    return `<div class="panel empty-state"><p>No dated execution results in this export yet.</p></div>`;
  }
  const head = days.map(d => `<th class="num">${fmtDate(d)}</th>`).join('');
  const body = testers.map(t => {
    const cells = days.map(d => {
      const c = grid[t][d];
      const tot = c.Passed + c.Failed + c['In Progress'];
      if (tot === 0) return `<td class="num muted">–</td>`;
      return `<td class="num day-cell">
        <div class="day-total">${tot}</div>
        <div class="day-breakdown">
          ${c.Passed ? `<span class="mini pass">${c.Passed}P</span>` : ''}
          ${c.Failed ? `<span class="mini fail">${c.Failed}F</span>` : ''}
          ${c['In Progress'] ? `<span class="mini prog">${c['In Progress']}I</span>` : ''}
        </div>
      </td>`;
    }).join('');
    return `<tr><td class="tester-cell">${escapeHtml(t)}</td>${cells}</tr>`;
  }).join('');
  return `
  <div class="panel">
    <div class="panel-head">
      <h2>Daily execution</h2>
      <span class="panel-sub">${days.length} day${days.length === 1 ? '' : 's'} of logged results</span>
    </div>
    <div class="table-wrap">
      <table class="data-table daily-table">
        <thead><tr><th>Tester</th>${head}</tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
  </div>`;
}

function renderDetail() {
  const reqOptions = Array.from(new Set(RAW.map(r => r['Req ID'] || 'Unassigned'))).sort();
  const testerOptions = Array.from(new Set(RAW.map(r => r['Test Case Assignee'] || 'Unassigned'))).sort();

  let rows = RAW;
  if (detailFilters.status !== 'All') rows = rows.filter(r => (r['Test Run Latest Status'] || 'N/A') === detailFilters.status);
  if (detailFilters.req !== 'All') rows = rows.filter(r => (r['Req ID'] || 'Unassigned') === detailFilters.req);
  if (detailFilters.tester !== 'All') rows = rows.filter(r => (r['Test Case Assignee'] || 'Unassigned') === detailFilters.tester);
  if (detailFilters.q) {
    const q = detailFilters.q.toLowerCase();
    rows = rows.filter(r => (r['Test Case Title'] || '').toLowerCase().includes(q) || (r['Test Case Id'] || '').toLowerCase().includes(q));
  }

  const bodyRows = rows.slice(0, 400).map(r => {
    const s = r['Test Run Latest Status'] || 'N/A';
    return `<tr>
      <td class="mono">${escapeHtml(r['Test Case Id'])}</td>
      <td>${escapeHtml(r['Test Case Title'])}</td>
      <td>${escapeHtml(r['Req ID'] || 'Unassigned')}</td>
      <td>${statusPill(s)}</td>
      <td>${escapeHtml(r['Test Case Priority'] || '—')}</td>
      <td>${escapeHtml(r['Test Case Assignee'] || 'Unassigned')}</td>
      <td>${fmtDateTime(r['Test Result Last Updated At'])}</td>
      <td>${escapeHtml(r['Test Result Defects'] || '—')}</td>
    </tr>`;
  }).join('');

  return `
  <div class="panel">
    <div class="panel-head detail-head">
      <h2>Test case detail</h2>
      <span class="panel-sub">${rows.length} matching${rows.length > 400 ? ' (showing first 400)' : ''}</span>
    </div>
    <div class="filters">
      <input type="text" id="q-input" placeholder="Search title or ID…" value="${escapeHtml(detailFilters.q)}" />
      <select id="status-select">
        <option ${detailFilters.status === 'All' ? 'selected' : ''}>All</option>
        ${STATUS_ORDER.map(s => `<option ${detailFilters.status === s ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
      <select id="req-select">
        <option ${detailFilters.req === 'All' ? 'selected' : ''}>All</option>
        ${reqOptions.map(r => `<option ${detailFilters.req === r ? 'selected' : ''}>${escapeHtml(r)}</option>`).join('')}
      </select>
      <select id="tester-select">
        <option ${detailFilters.tester === 'All' ? 'selected' : ''}>All</option>
        ${testerOptions.map(t => `<option ${detailFilters.tester === t ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('')}
      </select>
    </div>
    <div class="table-wrap">
      <table class="data-table detail-table">
        <thead><tr><th>Test case ID</th><th>Title</th><th>Requirement</th><th>Status</th><th>Priority</th><th>Assignee</th><th>Last updated</th><th>Defects</th></tr></thead>
        <tbody>${bodyRows || '<tr><td colspan="8" class="muted" style="text-align:center;padding:24px">No matching test cases</td></tr>'}</tbody>
      </table>
    </div>
  </div>`;
}

function render() {
  const tabs = [
    { id: 'overview', label: 'Overview' },
    { id: 'daily', label: 'Daily execution' },
    { id: 'tester', label: 'By tester' },
    { id: 'detail', label: 'Test detail' }
  ];
  const tabBar = tabs.map(t => `<button class="tab-btn ${activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('');

  let body = '';
  if (activeTab === 'overview') body = renderOverview();
  else if (activeTab === 'daily') body = renderDaily();
  else if (activeTab === 'tester') body = renderByTester();
  else if (activeTab === 'detail') body = renderDetail();

  document.getElementById('root').innerHTML = `
    <div class="app">
      <header class="app-header">
        <div class="header-inner">
          <div>
            <div class="eyebrow">MONUMENT TECHNOLOGY · CASTLE TRUST BANK</div>
            <h1>${escapeHtml(META.title)}</h1>
            <div class="header-meta">Source: BrowserStack Test Management · Generated ${escapeHtml(META.generated)}</div>
          </div>
          <div class="header-actions">
            <label class="upload-btn">
              Load new export
              <input type="file" id="csv-input" accept=".csv" hidden />
            </label>
          </div>
        </div>
        <div class="gold-rule"></div>
      </header>
      <nav class="tab-bar">${tabBar}</nav>
      <main class="app-main">${body}</main>
      <footer class="app-footer">MONUMENT TECHNOLOGY · Confidential &amp; Private</footer>
    </div>
  `;
  wireEvents();
}

function wireEvents() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
  });
  const fileInput = document.getElementById('csv-input');
  if (fileInput) fileInput.addEventListener('change', handleFile);

  const qInput = document.getElementById('q-input');
  if (qInput) qInput.addEventListener('input', e => { detailFilters.q = e.target.value; renderDetailOnly(); });
  const sSel = document.getElementById('status-select');
  if (sSel) sSel.addEventListener('change', e => { detailFilters.status = e.target.value; render(); });
  const rSel = document.getElementById('req-select');
  if (rSel) rSel.addEventListener('change', e => { detailFilters.req = e.target.value; render(); });
  const tSel = document.getElementById('tester-select');
  if (tSel) tSel.addEventListener('change', e => { detailFilters.tester = e.target.value; render(); });
}

function renderDetailOnly() {
  // lightweight re-render of just the detail table when typing in search, to keep focus
  const main = document.querySelector('.app-main');
  if (main) main.innerHTML = renderDetail();
  const qInput = document.getElementById('q-input');
  if (qInput) {
    qInput.focus();
    const val = qInput.value;
    qInput.value = '';
    qInput.value = val;
  }
  const sSel = document.getElementById('status-select');
  if (sSel) sSel.addEventListener('change', e => { detailFilters.status = e.target.value; render(); });
  const rSel = document.getElementById('req-select');
  if (rSel) rSel.addEventListener('change', e => { detailFilters.req = e.target.value; render(); });
  const tSel = document.getElementById('tester-select');
  if (tSel) tSel.addEventListener('change', e => { detailFilters.tester = e.target.value; render(); });
  const qInput2 = document.getElementById('q-input');
  if (qInput2) qInput2.addEventListener('input', e => { detailFilters.q = e.target.value; renderDetailOnly(); });
}

function splitRunTitle(t) {
  if (!t) return { req: 'Unassigned', desc: 'No test run assigned' };
  if (t.includes('|')) {
    const idx = t.indexOf('|');
    return { req: t.slice(0, idx).trim(), desc: t.slice(idx + 1).trim() };
  }
  return { req: t.trim(), desc: t.trim() };
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (evt) {
    const text = evt.target.result;
    // BrowserStack exports have 11 metadata rows before the real header row
    const lines = text.split(/\r\n|\n/);
    const dataText = lines.slice(11).join('\n');
    const parsed = Papa.parse(dataText, { header: true, skipEmptyLines: true });
    const records = parsed.data.map(row => {
      const split = splitRunTitle(row['Test Run Title']);
      return {
        'Test Case Id': row['Test Case Id'] || '',
        'Test Case Title': row['Test Case Title'] || '',
        'Test Case Priority': row['Test Case Priority'] || '',
        'Folder Path': row['Folder Path'] || '',
        'Req ID': split.req,
        'Run Desc': split.desc,
        'Test Run Latest Status': row['Test Run Latest Status'] || 'N/A',
        'Test Case Assignee': row['Test Case Assignee'] || 'Unassigned',
        'Test Result Last Updated At': row['Test Result Last Updated At'] || '',
        'Test Case Requirements': row['Test Case Requirements'] || '',
        'Test Run Title': row['Test Run Title'] || '',
        'Test Result Defects': row['Test Result Defects'] || ''
      };
    }).filter(r => r['Test Case Id']);
    RAW = records;
    META.generated = new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' (from ' + file.name + ')';
    activeTab = 'overview';
    render();
  };
  reader.readAsText(file);
}

function init(initialRecords, meta) {
  RAW = initialRecords;
  META = meta;
  render();
}
